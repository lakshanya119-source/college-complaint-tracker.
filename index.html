<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Complaint Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>College Complaint Tracker</h1>
    <p>Raise, edit, update, and delete complaints easily.</p>

    <div class="card">
      <h2>Raise a Complaint</h2>
      <input type="text" id="title" placeholder="Complaint title" />
      <textarea id="details" placeholder="Describe your issue"></textarea>
      <select id="category">
        <option value="Hostel">Hostel</option>
        <option value="Classroom">Classroom</option>
        <option value="Wi-Fi">Wi-Fi</option>
        <option value="Canteen">Canteen</option>
        <option value="Lab">Lab</option>
      </select>

      <button type="button" id="submitBtn">Submit Complaint</button>
      <button type="button" id="updateBtn" style="display:none;">Update Complaint</button>
    </div>

    <div class="card">
      <h2>My Complaints</h2>
      <div id="complaintList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
